[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdk"
version = "0.1.0"
description = "Python SDK for Open Telekom Cloud"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.12,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10",
    "pytest-httpx>=0.36",
    "ruff>=0.15.2",
    "mypy>=1.19",
]

docs = [
    "sphinx>=8.0",
    "sphinx-rtd-theme>=3.0",
    "sphinx-autodoc-typehints>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sdk"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
