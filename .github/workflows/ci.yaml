name: CI
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  noop:
    name: noop
    runs-on: ubuntu-latest
    steps:
      - name: Stub lint (no-op)
        run: echo "Skipping lint for now"

  check:
    name: check
    if: >
      always()
    needs: [noop]
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
